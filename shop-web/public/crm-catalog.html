<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM 商品目录 · 麦仓</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/crm-catalog.js"></script>
</head>
<body>
  <header class="header">
    <div class="wrap header-bar">
      <a class="brand" href="/">麦仓 <small>面粉商城</small></a>
      <a href="/#catalog">返回商城</a>
    </div>
  </header>
  <main class="wrap catalog" id="catalog">
    <h1>CRM 商品目录</h1>
    <p class="muted" id="source"></p>
    <form class="filters crm-filters" id="filters" hidden>
      <label>搜索商品 <input id="keyword" type="search" placeholder="商品名、品牌或 SKU 货号" maxlength="100"></label>
      <button class="button primary" type="submit">搜索</button>
    </form>
    <div class="crm-categories" id="categories" role="region" aria-label="商品分类筛选" hidden></div>
    <p id="summary" class="muted" role="status">正在从商品库读取…</p>
    <div id="products" class="crm-groups"></div>
    <div id="pagination" class="pagination" hidden>
      <button id="previous" class="plain" type="button">上一页</button>
      <span id="page-number"></span>
      <button id="next" class="plain" type="button">下一页</button>
    </div>
  </main>
</body>
</html>
