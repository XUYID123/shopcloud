spring.application.name=shop-inventory
server.port=8086
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}

# 从模块目录启动时使用本模块 Compose；部署环境可关闭并连接独立库存库。
spring.docker.compose.enabled=${SHOP_INVENTORY_COMPOSE_ENABLED:true}
spring.docker.compose.file=${SHOP_INVENTORY_COMPOSE_FILE:compose.yaml}
spring.docker.compose.lifecycle-management=start-only
spring.datasource.url=jdbc:mysql://${SHOP_INVENTORY_MYSQL_HOST:127.0.0.1}:${SHOP_INVENTORY_MYSQL_PORT:3309}/flour_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${SHOP_INVENTORY_MYSQL_USER:shop_inventory}
spring.datasource.password=${SHOP_INVENTORY_MYSQL_PASSWORD:shop_inventory_local_dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# 严格解析输入，禁止客户端写入状态、库存余额、版本或操作人。
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.jackson2.deserialization.fail-on-trailing-tokens=true
spring.jackson2.deserialization.accept-float-as-int=false
spring.jackson2.mapper.allow-coercion-of-scalars=false

shop.internal-auth.public-key-location=${SHOP_GATEWAY_INTERNAL_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/gateway-internal-public.pem}
shop.inventory.product-url=${SHOP_INVENTORY_PRODUCT_URL:}
shop.inventory.signing-private-key-location=${SHOP_INVENTORY_SIGNING_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/inventory-product-private.pem}
shop.inventory.reservation-lookup.enabled=${SHOP_INVENTORY_RESERVATION_LOOKUP_ENABLED:false}
shop.inventory.reservation-lookup.public-key-location=${SHOP_ORDER_INVENTORY_SIGNING_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/order-inventory-public.pem}
