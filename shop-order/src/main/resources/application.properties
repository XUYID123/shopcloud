spring.application.name=shop-order
server.port=8084
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}

spring.docker.compose.enabled=${SHOP_ORDER_COMPOSE_ENABLED:true}
spring.docker.compose.file=${SHOP_ORDER_COMPOSE_FILE:compose.yaml}
spring.docker.compose.lifecycle-management=start-only
spring.datasource.url=jdbc:mysql://${SHOP_ORDER_MYSQL_HOST:127.0.0.1}:${SHOP_ORDER_MYSQL_PORT:3310}/flour_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${SHOP_ORDER_MYSQL_USER:shop_order}
spring.datasource.password=${SHOP_ORDER_MYSQL_PASSWORD:shop_order_local_dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.jackson2.deserialization.fail-on-trailing-tokens=true
spring.jackson2.deserialization.accept-float-as-int=false
spring.jackson2.mapper.allow-coercion-of-scalars=false
spring.jackson2.parser.strict-duplicate-detection=true

# 公共内部 JWT starter 默认强制启用；只读取网关公钥。
shop.internal-auth.public-key-location=${SHOP_GATEWAY_INTERNAL_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/gateway-internal-public.pem}
shop.order.cart.product-url=${SHOP_ORDER_CART_PRODUCT_URL:}
shop.order.cart.signing-private-key-location=${SHOP_ORDER_CART_SIGNING_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/order-cart-product-private.pem}

shop.order.checkout.enabled=${SHOP_ORDER_CHECKOUT_ENABLED:false}
shop.order.checkout.region-codes=${SHOP_ORDER_CHECKOUT_REGION_CODES:310115}
shop.order.checkout.user-url=${SHOP_ORDER_CHECKOUT_USER_URL:}
shop.order.checkout.product-url=${SHOP_ORDER_CHECKOUT_PRODUCT_URL:}
shop.order.checkout.address-key-location=${SHOP_ORDER_ADDRESS_SIGNING_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/order-user-private.pem}
shop.order.checkout.product-key-location=${SHOP_ORDER_QUOTE_PRODUCT_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/order-quote-product-private.pem}
shop.order.m3.enabled=${SHOP_ORDER_M3_ENABLED:false}
shop.order.m4.enabled=${SHOP_ORDER_M4_ENABLED:false}
shop.order.m4.payment-context.public-key=${SHOP_PAY_ORDER_SIGNING_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/pay-order-public.pem}
shop.order.m5.enabled=${SHOP_ORDER_M5_ENABLED:false}
shop.order.m5.inventory-url=${SHOP_ORDER_INVENTORY_URL:}
shop.order.m5.inventory-key-location=${SHOP_ORDER_INVENTORY_SIGNING_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/order-inventory-private.pem}
shop.order.admission.cluster.enabled=${SHOP_ORDER_CLUSTER_LIMIT_ENABLED:false}
shop.order.admission.cluster.host=${SHOP_ORDER_TOKEN_SERVER_HOST:127.0.0.1}
shop.order.admission.cluster.port=${SHOP_ORDER_TOKEN_SERVER_PORT:18730}
shop.order.admission.cluster.timeout-ms=${SHOP_ORDER_TOKEN_TIMEOUT_MS:50}
shop.order.admission.circuit-enabled=${SHOP_ORDER_CHECKOUT_CIRCUIT_ENABLED:false}
