name: flour-shop-order
services:
  mysql-order:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: flour_order
      MYSQL_USER: ${SHOP_ORDER_MYSQL_USER:-shop_order}
      MYSQL_PASSWORD: ${SHOP_ORDER_MYSQL_PASSWORD:-shop_order_local_dev}
      MYSQL_ROOT_PASSWORD: ${SHOP_ORDER_MYSQL_ROOT_PASSWORD:-shop_order_root_local_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${SHOP_ORDER_MYSQL_PORT:-3310}:3306"
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4"]
    volumes:
      - mysql-order-data:/var/lib/mysql
    healthcheck:
      test: >-
        MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1
        -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-order-data:
