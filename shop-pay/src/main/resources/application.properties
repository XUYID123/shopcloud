spring.application.name=shop-pay
server.port=8085
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}

# 支付库独立运行，开发环境可使用本模块 Compose。
spring.datasource.url=jdbc:mysql://${SHOP_PAY_MYSQL_HOST:127.0.0.1}:${SHOP_PAY_MYSQL_PORT:3311}/flour_pay?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${SHOP_PAY_MYSQL_USER:shop_pay}
spring.datasource.password=${SHOP_PAY_MYSQL_PASSWORD:shop_pay_local_dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
spring.flyway.clean-disabled=true
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.jackson2.deserialization.fail-on-trailing-tokens=true
spring.jackson2.deserialization.accept-float-as-int=false
spring.jackson2.mapper.allow-coercion-of-scalars=false
spring.jackson2.parser.strict-duplicate-detection=true

# 公共内部 JWT starter 默认强制启用；只读取网关公钥。
shop.internal-auth.public-key-location=${SHOP_GATEWAY_INTERNAL_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/gateway-internal-public.pem}
shop.internal-auth.public-endpoints[0].methods=POST
shop.internal-auth.public-endpoints[0].paths=/callbacks/payments/MOCK
shop.pay.enabled=${SHOP_PAY_ENABLED:false}
shop.pay.order-url=${SHOP_PAY_ORDER_URL:}
shop.pay.order-private-key=${SHOP_PAY_ORDER_SIGNING_PRIVATE_KEY_LOCATION:file:../infra/local-secrets/pay-order-private.pem}
shop.pay.reconciliation.public-key=${SHOP_ORDER_PAY_SIGNING_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/order-pay-public.pem}
shop.pay.mock.secret=${SHOP_PAY_MOCK_SECRET:}
shop.pay.mock.merchant=${SHOP_PAY_MOCK_MERCHANT:flour-dev}
