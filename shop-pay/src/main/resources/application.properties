spring.application.name=shop-pay
server.port=8085
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP

# 默认继承数据库依赖；当前骨架尚未配置自己的数据库，暂不启用数据库自动装配。
# 接入本服务的数据源、Mapper 和 Flyway 迁移时删除下列配置。
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# 公共内部 JWT starter 默认强制启用；只读取网关公钥。
shop.internal-auth.public-key-location=${SHOP_GATEWAY_INTERNAL_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/gateway-internal-public.pem}
