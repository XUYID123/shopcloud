spring.application.name=shop-product
server.port=8082
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP

# 商品服务独立拥有数据库，默认从模块工作目录启动，根目录运行时指定 Compose 绝对路径。
spring.docker.compose.enabled=${SHOP_PRODUCT_COMPOSE_ENABLED:true}
spring.docker.compose.file=${SHOP_PRODUCT_COMPOSE_FILE:compose.yaml}
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.readiness.timeout=5m
spring.datasource.url=jdbc:mysql://${SHOP_PRODUCT_MYSQL_HOST:127.0.0.1}:${SHOP_PRODUCT_MYSQL_PORT:3308}/flour_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SHOP_PRODUCT_MYSQL_USER:shop_product}
spring.datasource.password=${SHOP_PRODUCT_MYSQL_PASSWORD:shop_product_local_dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
# 开发默认使用业务 Redis。部署通过商品服务自己的 Spring Redis Sentinel/Cluster 配置和 ACL 连接。
spring.data.redis.host=${SHOP_PRODUCT_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SHOP_PRODUCT_REDIS_PORT:${SHOP_CACHE_REDIS_PORT:6381}}
spring.data.redis.password=${SHOP_PRODUCT_REDIS_PASSWORD:${SHOP_CACHE_REDIS_PASSWORD:shop_cache_local_dev}}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=3
spring.http.converters.preferred-json-mapper=jackson2
# 输入严格遵守契约：不能偷偷传 ID/角色，不能将小数截断成排序整数。
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.jackson2.deserialization.fail-on-trailing-tokens=true
spring.jackson2.deserialization.accept-float-as-int=false
spring.jackson2.mapper.allow-coercion-of-scalars=false

# 公共内部 JWT starter 默认强制启用；只读取网关公钥。
shop.internal-auth.public-key-location=${SHOP_GATEWAY_INTERNAL_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/gateway-internal-public.pem}
shop.internal-auth.public-endpoints[0].methods=GET
shop.internal-auth.public-endpoints[0].paths=/api/v1/categories,/api/v1/categories/**,/api/v1/products,/api/v1/products/**,/api/v1/skus/{skuId}
# 库存服务使用独立签名密钥。本服务只在显式启用后加载它的公钥。
shop.product.inventory-lookup.enabled=${SHOP_PRODUCT_INVENTORY_LOOKUP_ENABLED:false}
shop.product.inventory-lookup.public-key-location=${SHOP_INVENTORY_SIGNING_PUBLIC_KEY_LOCATION:file:../infra/local-secrets/inventory-product-public.pem}
